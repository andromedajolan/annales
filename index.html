<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Annales</title>
<meta name="description" content="Offline catalogue, release tracker and promo planner.">
<meta name="theme-color" content="#111216">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<script>
/* Apply the shared suite theme before first paint (no flash). */
try {
  var t = localStorage.getItem('studio.theme');
  if (t === 'dark' || t === 'gray' || t === 'light') document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
</head>
<body>
<header class="topbar">
  <a class="ianua" href="/">← Ianua</a>
  <h1 class="brand">Annales</h1>
  <span id="saveState" class="save" role="status" aria-live="polite"></span>
</header>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div id="banner" class="banner" hidden></div>
<main id="app" tabindex="-1"><p class="muted pad">Loading…</p></main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<dialog id="dlg"></dialog>
<noscript><p class="pad">Annales needs JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
